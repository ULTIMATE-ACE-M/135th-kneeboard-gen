<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Kneeboard Preview</title><style>*{box-sizing:border-box;margin:0;padding:0;font-family:'Courier New',monospace;font-size:10px;}body{background:#0a0e14;color:#c0d8e8;overflow:hidden;width:100vw;height:100vh;}#canvas{position:relative;width:100%;height:100%;}.blk{position:absolute;border:1px solid #1e3a4a;background:#0d1620;overflow:hidden;display:flex;flex-direction:column;}.blk-title{background:#0a1824;color:#4cc9f0;padding:2px 4px;font-weight:bold;font-size:9px;letter-spacing:1px;text-align:center;border-bottom:1px solid #1e3a4a;flex-shrink:0;}.blk-row{display:flex;border-bottom:1px solid #131c27;flex-shrink:0;}.blk-label{color:#4a7a9a;padding:1px 3px;min-width:35%;border-right:1px solid #131c27;overflow:hidden;white-space:nowrap;}.blk-val{color:#9de0b4;padding:1px 3px;flex:1;overflow:hidden;white-space:nowrap;}.blk-header{background:#0a1824;color:#4cc9f0;font-size:12px;font-weight:bold;letter-spacing:2px;display:flex;align-items:center;justify-content:center;width:100%;height:100%;padding:4px;text-align:center;}.blk-empty{color:#2a4a5a;padding:4px;text-align:center;}</style></head><body><div id="canvas"></div><script>var F=['CALLSIGN','MISSION','DEPARTURE','ARRIVAL','TOT','DATE','THEATER','TYPE','LEAD','PKG','SQUAWK','LASER','BINGO','JOKER','WEATHER','ROE'];function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}function renderBlock(b){var el=document.createElement('div');el.className='blk';el.style.cssText='left:'+(b.x||0)+'%;top:'+(b.y||0)+'%;width:'+(b.w||20)+'%;height:'+(b.h||20)+'%;';var cfg=b.cfg||{};if(b.type==='header'){el.innerHTML='<div class="blk-header">'+esc(cfg.title||'KNEEBOARD')+'</div>';}else if(b.type==='mission'){var n=cfg.rows||6;var v=cfg.values||{};var h='<div class="blk-title">MISSION</div>';F.slice(0,n).forEach(function(f){h+='<div class="blk-row"><span class="blk-label">'+esc(f)+'</span><span class="blk-val">'+esc(v[f]||'')+'</span></div>';});el.innerHTML=h;}else{var rows=Array.isArray(cfg.rows)?cfg.rows:[];var t=(b.type||'').toUpperCase();var h='<div class="blk-title">'+esc(t)+'</div>';if(!rows.length){h+='<div class="blk-empty">'+esc(t)+'</div>';}else{rows.forEach(function(r){if(!Array.isArray(r))return;h+='<div class="blk-row">';r.forEach(function(c,j){h+=j===0?'<span class="blk-label">'+esc(c)+'</span>':'<span class="blk-val">'+esc(c)+'</span>';});h+='</div>';});}el.innerHTML=h;}return el;}function render(data){var c=document.getElementById('canvas');c.innerHTML='';if(data&&data.pages&&data.pages[0])data.pages[0].forEach(function(b){c.appendChild(renderBlock(b));});}window.addEventListener('message',function(e){if(e.data&&e.data.type==='load-kneeboard'&&e.data.data)render(e.data.data);});</script></body></html>
