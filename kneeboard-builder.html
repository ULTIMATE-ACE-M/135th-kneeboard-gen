function getAutoFill(type,md){
  if(!md)return{};
  const v=(x)=>x||'';
  if(type==='header')return{title:[md.callsign,md.mission_name].filter(Boolean).join(' · ')||'135TH SQN · MISSION KNEEBOARD'};
  if(type==='mission')return{values:{CALLSIGN:v(md.callsign),MISSION:v(md.mission_name),DEPARTURE:v(md.departure_airfield),ARRIVAL:v(md.recovery_airfield),TOT:v(md.time_on_target),DATE:v(md.date),THEATER:v(md.theater),TYPE:v(md.mission_type),LEAD:v(md.flight_lead),PKG:v(md.callsign),SQUAWK:v(md.squawk),LASER:v(md.laser_code),BINGO:v(md.bingo_fuel),JOKER:v(md.joker_fuel),WEATHER:v(md.weather),ROE:v(md.roe)}};
  if(type==='flight')return{rows:[[1,[md.callsign,md.flight_lead].filter(Boolean).join(' / ')||'',v(md.mission_type),v(md.date)]]};
  if(type==='uhfvhf'){var _f=(md.frequencies||[]);if(!_f.length)return{};return{rows:_f.map(function(x){return[x.name||'',x.frequency||'',x.modulation||''];})};}
  if(type==='comms'){var _f=(md.frequencies||[]);if(!_f.length)return{rows:[['AIRFIELD',v(md.airfield_comms),''],[v(md.awacs_callsign)||'AWACS',v(md.awacs_freq),''],['TAC',v(md.tac_freq),''],['ATIS/GUARD','121.500','']]};return{rows:_f.map(function(x){return[x.name||'',x.frequency||'',x.modulation||''];})};}
  if(type==='iff')return{values:{'MODE 3':v(md.squawk),SQUAWK:v(md.squawk)}};
  if(type==='recovery')return{rows:[[v(md.departure_airfield),v(md.airfield_comms),'HOME'],[v(md.recovery_airfield),'','RCVY']]};
  if(type==='pilots')return{rows:[[1,v(md.callsign),'','']]};
  return{};
}
function App(){
  const[pages,setPages]=useState([[], []]);
  const[pageIdx,setPageIdx]=useState(0);
  const[sel,setSel]=useState(null);
  const[showGrid,setShowGrid]=useState(true);
  const[snapOn,setSnapOn]=useState(true);
  const[undo,setUndo]=useState([]);
  const[showModal,setShowModal]=useState(false);
  const[savedTemplates,setSavedTemplates]=useState([]);
  const[openGrp,setOpenGrp]=useState({LAYOUT:true,MISSION:true,COMMS:true,INTEL:false,NAV:true,LOADOUT:true,CHECKS:true,CUSTOM:true});

  const dragR=useRef(null), resizeR=useRef(null);
  const blocks=pages[pageIdx];

  const setBlocks=fn=>setPages(p=>{const np=[...p];np[pageIdx]=typeof fn==='function'?fn(np[pageIdx]):fn;return np;});
  const pushUndo=snap=>setUndo(s=>[...s.slice(-30),snap]);
  const [missionData,setMissionData]=useState(null);
  useEffect(()=>{const _h=e=>{if(e&&e.data&&e.data.type==='mission-data'){const md=e.data.mission;setMissionData(md);if(md)setPages(pp=>pp.map(pg=>pg.map(b=>{const af=getAutoFill(b.type,md);return af&&Object.keys(af).length?{...b,config:{...b.config,...af}}:b;})));}if(e&&e.data&&e.data.type==='load-layout'&&e.data.data&&e.data.data.pages){setPages(e.data.data.pages);if(e.data.data.savedTemplates)setSavedTemplates(e.data.data.savedTemplates);setPageIdx(0);}};window.addEventListener('message',_h);return()=>window.removeEventListener('message',_h);},[]);
  useEffect(()=>{const _l=e=>{if(e&&e.data&&e.data.type==='load-kneeboard'&&e.data.data){if(e.data.data.pages)setPages(e.data.data.pages);if(e.data.data.savedTemplates)setSavedTemplates(e.data.data.savedTemplates);}};window.addEventListener('message',_l);return()=>window.removeEventListener('message',_l);},[]);
  const doUndo=()=>{if(!undo.length)return;setBlocks(JSON.parse(undo[undo.length-1]));setUndo(s=>s.slice(0,-1));setSel(null);};
  const addBlock=(type,cfg)=>{pushUndo(JSON.stringify(blocks));const _af=missionData?getAutoFill(type,missionData):{};setBlocks(b=>[...b,mkBlock(type,20+(b.length%5)*6,20+(b.length%7)*8,Object.assign({},_af,cfg||{}))]);};  const delSel=()=>{if(!sel)return;const b=blocks.find(x=>x.id===sel);if(b?.locked)return;pushUndo(JSON.stringify(blocks));setBlocks(b=>b.filter(x=>x.id!==sel));setSel(null);};
  const dupSel=()=>{if(!sel)return;const b=blocks.find(x=>x.id===sel);if(!b)return;pushUndo(JSON.stringify(blocks));const nb={...b,id:_uid++,x:b.x+10,y:b.y+10};setBlocks(bl=>[...bl,nb]);setSel(nb.id);};
  const updProp=(k,v)=>{if(!sel)return;setBlocks(b=>b.map(x=>x.id===sel?{...x,[k]:v}:x));};
  const updCfg=cfg=>{if(!sel)return;setBlocks(b=>b.map(x=>x.id===sel?{...x,config:cfg}:x));};

  const saveTemplate=(cfg)=>{
    const name=(cfg.title||'CUSTOM').trim().toUpperCase()||'CUSTOM';
    setSavedTemplates(ts=>[...ts,{id:_uid++,name,config:{...cfg}}]);
  };
  const deleteTemplate=(tid)=>setSavedTemplates(ts=>ts.filter(t=>t.id!==tid));

  const toFront=()=>{pushUndo(JSON.stringify(blocks));setBlocks(b=>{const r=b.filter(x=>x.id!==sel),bl=b.find(x=>x.id===sel);return bl?[...r,bl]:b;});};
  const toBack=()=>{pushUndo(JSON.stringify(blocks));setBlocks(b=>{const r=b.filter(x=>x.id!==sel),bl=b.find(x=>x.id===sel);return bl?[bl,...r]:b;});};

  useEffect(()=>{
    const onKey=e=>{
      if(document.activeElement?.tagName==='INPUT')return;
      if(e.key==='Delete'||e.key==='Backspace')delSel();
      if(e.key==='Escape')setSel(null);      if(e.key==='Escape')setSel(null);
      if(e.ctrlKey&&e.key==='d'){e.preventDefault();dupSel();}
      if(e.ctrlKey&&e.key==='z'){e.preventDefault();doUndo();}
    };
    window.addEventListener('keydown',onKey);
    return()=>window.removeEventListener('keydown',onKey);
  },[sel,blocks,undo]);

  useEffect(()=>{
    const onMove=e=>{
      if(dragR.current){
        const d=dragR.current;
        let nx=d.ox+(e.clientX-d.sx),ny=d.oy+(e.clientY-d.sy);
        if(snapOn){nx=snapV(nx);ny=snapV(ny);}
        nx=Math.max(0,Math.min(460-d.w,nx));ny=Math.max(0,Math.min(660-d.h,ny));
        setBlocks(b=>b.map(x=>x.id===d.id?{...x,x:nx,y:ny}:x));
      }
      if(resizeR.current){
        const r=resizeR.current,dx=e.clientX-r.sx,dy=e.clientY-r.sy;
        let{ox:nx,oy:ny,ow:nw,oh:nh}=r,h=r.handle;
        if(h.includes('e'))nw=Math.max(30,r.ow+dx);
        if(h.includes('s'))nh=Math.max(20,r.oh+dy);
        if(h.includes('w')){nx=r.ox+dx;nw=Math.max(30,r.ow-dx);}
        if(h.includes('n')){ny=r.oy+dy;nh=Math.max(20,r.oh-dy);}
        if(snapOn){nw=snapV(nw);nh=snapV(nh);nx=snapV(nx);ny=snapV(ny);}
        setBlocks(b=>b.map(x=>x.id===r.id?{...x,x:Math.max(0,nx),y:Math.max(0,ny),w:nw,h:nh}:x));
      }
    };
    const onUp=()=>{dragR.current=null;resizeR.current=null;};
    window.addEventListener('mousemove',onMove);
    window.addEventListener('mouseup',onUp);
    return()=>{window.removeEventListener('mousemove',onMove);window.removeEventListener('mouseup',onUp);};
  },[snapOn,pageIdx])
  useEffect(()=>{
    const _sp={v:1,pages,savedTemplates};
    try{window.parent.postMessage({type:'builder-autosave',data:_sp},'*');}catch(_){}
  },[pages,savedTemplates]);;

  const selBlock=blocks.find(x=>x.id===sel);

  return(
    <div style={{display:'flex',height:'100vh',background:'#0a0e14',userSelect:'none'}}>

      {/* ── LEFT PALETTE ── */}
      <div style={{width:'162px',borderRight:'1px solid #192535',display:'flex',flexDirection:'column',overflowY:'auto',flexShrink:0}}>
        <div style={{padding:'9px 8px 6px',color:'#00d4ff',fontSize:'16px',fontWeight:'bold',letterSpacing:'3px',borderBottom:'1px solid #192535',flexShrink:0}}>BLOCKS</div>
        {GROUPS.map(grp=>{
          const types=Object.entries(BLOCK_DEFS).filter(([,d])=>d.group===grp).map(([t])=>t);
          const grpTemplates = grp==='CUSTOM' ? savedTemplates : [];
          if(!types.length && !grpTemplates.length)return null;
          const open=openGrp[grp]!==false;
          const count = grp==='CUSTOM' ? types.length + grpTemplates.length : types.length;
          return(
            <div key={grp}>
              <button onClick={()=>setOpenGrp(g=>({...g,[grp]:!g[grp]}))} style={{
                width:'100%',background:'#0a0e14',border:'none',borderBottom:'1px solid #192535',
                padding:'4px 8px',display:'flex',alignItems:'center',gap:'5px',cursor:'pointer',
                color:'#3a5060',fontSize:'18px',letterSpacing:'2px'}}>
                <span style={{color:'#253545'}}>{open?'▾':'▸'}</span>{grp}
                <span style={{marginLeft:'auto',color:'#253545',fontSize:'16px'}}>{count}</span>
              </button>
              {open&&(
                <div style={{padding:'3px 5px',display:'flex',flexDirection:'column',gap:'2px'}}>
                  {types.map(type=>
                    type==='custom'?(
                      <button key={type} onClick={()=>setShowModal(true)} style={{
                        background:'#130a28',border:'1px solid #a080ff',color:'#a080ff',
                        padding:'5px 6px',cursor:'pointer',fontSize:'18px',letterSpacing:'1px',textAlign:'left',width:'100%'}}>
                        ✦ CUSTOM BLOCK
                      </button>
                    ):(
                      <PalBtn key={type} type={type} onClick={()=>addBlock(type)}/>
                    )
                  )}
                  {grpTemplates.map(tmpl=>(
                    <div key={tmpl.id} style={{display:'flex',gap:'2px',alignItems:'stretch'}}>
                      <button onClick={()=>addBlock('custom',tmpl.config)} style={{
                        flex:1,background:'#0d0820',border:'1px solid #6050aa',color:'#c0a0ff',
                        padding:'4px 6px',cursor:'pointer',fontSize:'11px',letterSpacing:'0.5px',
                        textAlign:'left',overflow:'hidden',whiteSpace:'nowrap',textOverflow:'ellipsis'}}>
                        ◈ {tmpl.name}
                      </button>
                      <button onClick={()=>deleteTemplate(tmpl.id)} title="Remove template" style={{
                        background:'#0d0820',border:'1px solid #6050aa',color:'#503060',
                        padding:'2px 5px',cursor:'pointer',fontSize:'11px',flexShrink:0}}>✕</button>
                    </div>
                  ))}
                </div>
              )}
            </div>
          );
        })}
        <div style={{flex:1}}/>
        <div style={{padding:'8px',fontSize:'16px',color:'#1e2e3e',lineHeight:'1.7',borderTop:'1px solid #192535'}}>
          CLICK TO ADD<br/>DRAG TO MOVE<br/>HANDLES: RESIZE
        </div>
      </div>

      {/* ── CENTER ── */}
      <div style={{flex:1,display:'flex',flexDirection:'column',minWidth:0}}>

        {/* Toolbar */}
        <div style={{background:'#070b10',borderBottom:'1px solid #192535',padding:'6px 12px',display:'flex',gap:'8px',alignItems:'center',flexShrink:0}}>
          <span style={{color:'#00d4ff',fontSize:'16px',fontWeight:'bold',letterSpacing:'2px'}}>135TH KNEEBOARD BUILDER</span>
          <div style={{flex:1}}/>
          {[0,1].map(i=>(
            <button key={i} onClick={()=>{setPageIdx(i);setSel(null);}} style={{
              background:pageIdx===i?'#00d4ff':'#070b10',color:pageIdx===i?'#000d1a':'#506070',
              border:'1px solid #1a3a5a',padding:'4px 12px',cursor:'pointer',fontSize:'12px',letterSpacing:'1px'}}>
              PAGE {i+1}
            </button>
          ))}
          <div style={{width:'1px',background:'#192535',height:'16px',margin:'0 2px'}}/>
          <TogBtn active={showGrid} onClick={()=>setShowGrid(v=>!v)} label="GRID"/>
          <TogBtn active={snapOn}   onClick={()=>setSnapOn(v=>!v)}   label="SNAP"/>
          <button onClick={doUndo} disabled={!undo.length} style={{
            background:'#070b10',color:undo.length?'#506070':'#202e3e',
            border:'1px solid #192535',padding:'4px 10px',cursor:undo.length?'pointer':'default',
            fontSize:'12px',letterSpacing:'1px'}}>UNDO</button>
          <div style={{width:'1px',background:'#192535',height:'16px',margin:'0 2px'}}/>
          <button onClick={()=>{
            const _sp={v:1,pages,savedTemplates};
            const blob=new Blob([JSON.stringify(_sp,null,0)],{type:'application/json'});
            const a=document.createElement('a');
            a.href=URL.createObjectURL(blob);
            a.download='kneeboard-layout.json';
            a.click();
            URL.revokeObjectURL(a.href);
            if(window.parent!==window){try{window.parent.postMessage({type:'kneeboard-saved',name:(missionData&&missionData.mission_name)||'Custom Kneeboard',callsign:(missionData&&missionData.callsign)||'',data:_sp},'*');}catch(_){}}
          }}style={{background:'#070b10',color:'#00d4ff',border:'1px solid #1a3a5a',padding:'4px 10px',
            cursor:'pointer',fontSize:'12px',letterSpacing:'1px'}}>SAVE</button>
          <label style={{background:'#070b10',color:'#506070',border:'1px solid #192535',padding:'4px 10px',
            cursor:'pointer',fontSize:'12px',letterSpacing:'1px'}}>
            LOAD
            <input type="file" accept=".json" style={{display:'none'}} onChange={e=>{
              const f=e.target.files[0];if(!f)return;
              const r=new FileReader();
              r.onload=ev=>{try{const d=JSON.parse(ev.target.result);if(d.pages)setPages(d.pages);if(d.savedTemplates)setSavedTemplates(d.savedTemplates);}catch(_){}};
              r.readAsText(f);
              e.target.value='';
            }}/>
          </label>
            <div style={{width:'1px',background:'#192535',height:'16px',margin:'0 2px'}}/>
            <button onClick={()=>{try{const _sp={v:1,pages,savedTemplates};if(window.parent&&window.parent!==window)window.parent.postMessage({type:'kneeboard-saved',name:'Kneeboard'+(missionData&&missionData.callsign?' – '+missionData.callsign:''),callsign:(missionData&&missionData.callsign)||'',data:_sp},'*');}catch(_){}}} style={{background:'#0a1f0a',color:'#00ff88',border:'1px solid #1a5a2a',padding:'4px 10px',cursor:'pointer',fontSize:'12px',letterSpacing:'1px',fontFamily:'inherit'}}>→ PREVIEW</button>
        </div>

        {/* Canvas */}
        <div style={{flex:1,overflow:'auto',display:'flex',alignItems:'flex-start',justifyContent:'center',padding:'22px',background:'#060910'}}>
          <div style={{
              position:'relative',width:'460px',height:'660px',flexShrink:0,
              background:'#0d1b2a',border:'2px solid #1a3a5a',
              boxShadow:'0 0 60px rgba(0,0,0,0.9)',
              backgroundImage:showGrid?'linear-gradient(rgba(0,212,255,0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(0,212,255,0.04) 1px, transparent 1px)':'none',
              backgroundSize:showGrid?`${SNAP}px ${SNAP}px`:'auto',
            }}
            onMouseDown={e=>{if(e.currentTarget===e.target)setSel(null);}}>
            {blocks.map((block,idx)=>(
              <KBBlock key={block.id} block={block} zIndex={idx+1} selected={sel===block.id}
                onSelect={()=>setSel(block.id)}                onPointerDown={e=>{pushUndo(JSON.stringify(blocks));dragR.current={id:block.id,sx:e.clientX,sy:e.clientY,ox:block.x,oy:block.y,w:block.w,h:block.h};}}
                onResizeStart={(e,handle)=>{pushUndo(JSON.stringify(blocks));resizeR.current={id:block.id,handle,sx:e.clientX,sy:e.clientY,ox:block.x,oy:block.y,ow:block.w,oh:block.h};}}
              />
            ))}
            {!blocks.length&&(
              <div style={{position:'absolute',inset:0,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:'8px',pointerEvents:'none'}}>
                <div style={{color:'#1a3a5a',fontSize:'18px',letterSpacing:'3px'}}>EMPTY PAGE</div>
                <div style={{color:'#1a3a5a',fontSize:'12px',letterSpacing:'2px'}}>← ADD BLOCKS FROM LEFT PANEL</div>
              </div>
            )}
          </div>
        </div>

        {/* Status */}
        <div style={{background:'#070b10',borderTop:'1px solid #192535',padding:'4px 12px',display:'flex',gap:'16px',fontSize:'18px',color:'#1e2e3e',letterSpacing:'1px',flexShrink:0}}>
          <span>PG {pageIdx+1} · {blocks.length} BLOCK{blocks.length!==1?'S':''}</span>
          <span>460 × 660 PX</span>
          {selBlock&&<span style={{color:'#3a5060'}}>{(BLOCK_DEFS[selBlock.type]?.label||'BLOCK').toUpperCase()} · {selBlock.w}×{selBlock.h} @ ({selBlock.x},{selBlock.y})</span>}
          <div style={{flex:1}}/>
          <span>DEL: delete · ESC: deselect · CTRL+D: duplicate · CTRL+Z: undo</span>
        </div>
      </div>

      {/* ── RIGHT PROPERTIES ── */}
      <div style={{width:'260px',borderLeft:'1px solid #192535',display:'flex',flexDirection:'column',flexShrink:0,overflowY:'auto'}}>
        <div style={{padding:'9px 10px 6px',color:'#00d4ff',fontSize:'16px',fontWeight:'bold',letterSpacing:'3px',borderBottom:'1px solid #192535',flexShrink:0}}>PROPERTIES</div>
        <div style={{padding:'10px',display:'flex',flexDirection:'column',gap:'8px',flex:1}}>
          {selBlock?(
            <>
              <div style={{color:selBlock.config?.accent||BLOCK_DEFS[selBlock.type]?.accent||'#00d4ff',fontSize:'12px',letterSpacing:'1px'}}>
                {(BLOCK_DEFS[selBlock.type]?.label||'CUSTOM').toUpperCase()}
              </div>

              <div style={{display:'flex',flexDirection:'column',gap:'4px',paddingTop:'6px',borderTop:'1px solid #192535'}}>
                <div style={{color:'#354555',fontSize:'18px',letterSpacing:'1px'}}>POSITION</div>
                <NumInput label="X" value={selBlock.x} onChange={v=>updProp('x',Math.max(0,v))}/>
                <NumInput label="Y" value={selBlock.y} onChange={v=>updProp('y',Math.max(0,v))}/>
              </div>

              <div style={{display:'flex',flexDirection:'column',gap:'4px',paddingTop:'6px',borderTop:'1px solid #192535'}}>
                <div style={{color:'#354555',fontSize:'18px',letterSpacing:'1px'}}>SIZE</div>
                <NumInput label="W" value={selBlock.w} onChange={v=>updProp('w',Math.max(20,v))}/>
                <NumInput label="H" value={selBlock.h} onChange={v=>updProp('h',Math.max(20,v))}/>
              </div>

              <div style={{paddingTop:'6px',borderTop:'1px solid #192535'}}>
                <BlockOpts block={selBlock} onChange={updCfg} onSaveTemplate={saveTemplate}/>
              </div>

              <label style={{display:'flex',alignItems:'center',gap:'7px',cursor:'pointer',fontSize:'12px',color:'#607080',paddingTop:'6px',borderTop:'1px solid #192535',letterSpacing:'1px'}}>
                <input type="checkbox" checked={!!selBlock.locked} onChange={e=>updProp('locked',e.target.checked)} style={{accentColor:'#00d4ff',cursor:'pointer'}}/>
                LOCKED
              </label>

              <div style={{display:'flex',flexDirection:'column',gap:'4px',paddingTop:'6px',borderTop:'1px solid #192535'}}>
                <button onClick={dupSel} style={{background:'#070b10',border:'1px solid #1a3a5a',color:'#506070',padding:'5px',cursor:'pointer',fontSize:'18px',letterSpacing:'1px'}}>DUPLICATE</button>
                <button onClick={delSel} disabled={selBlock.locked} style={{background:selBlock.locked?'#070b10':'#180808',border:'1px solid #2a1818',color:selBlock.locked?'#202830':'#cc4444',padding:'5px',cursor:selBlock.locked?'not-allowed':'pointer',fontSize:'18px',letterSpacing:'1px'}}>DELETE</button>
              </div>

              <div style={{display:'flex',flexDirection:'column',gap:'4px',paddingTop:'6px',borderTop:'1px solid #192535'}}>
                <div style={{color:'#354555',fontSize:'18px',letterSpacing:'1px'}}>Z-ORDER</div>
                <button onClick={toFront} style={{background:'#070b10',border:'1px solid #192535',color:'#405060',padding:'4px',cursor:'pointer',fontSize:'18px',letterSpacing:'1px'}}>TO FRONT</button>
                <button onClick={toBack}  style={{background:'#070b10',border:'1px solid #192535',color:'#405060',padding:'4px',cursor:'pointer',fontSize:'18px',letterSpacing:'1px'}}>TO BACK</button>
              </div>
            </>
          ):(
            <div style={{color:'#1e2e3e',fontSize:'12px',lineHeight:'2',letterSpacing:'1px'}}>
              CLICK A BLOCK<br/>TO SELECT IT.<br/><br/>OPTIONS APPEAR<br/>WHEN SELECTED.
            </div>
          )}
        </div>
        <div style={{padding:'8px 10px',fontSize:'16px',color:'#1e2e3e',borderTop:'1px solid #192535',lineHeight:'1.8',flexShrink:0}}>
          PG 1: {pages[0].length} · PG 2: {pages[1].length}<br/>
          UNDO STEPS: {undo.length}
        </div>
      </div>

      {showModal&&<CustomModal onClose={()=>setShowModal(false)} onCreate={cfg=>{addBlock('custom',cfg);setShowModal(false);}}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
